# Riftbound Restock-Watcher – Shop-Konfiguration
#
# in_stock_keywords / out_of_stock_keywords: optional, ueberschreiben die
# Standard-Keywords (siehe check_stock.py) fuer diesen Shop.
#
# unreliable: true = Seite nutzt Bot-Schutz oder laedt Inhalte per JavaScript nach.
# Der einfache HTML-Keyword-Check funktioniert dort oft nicht zuverlaessig.
# Diese Shops besser weiter manuell im Ledger-Tool pruefen.

shops:
  - id: riot
    name: "Riot Games Store"
    category: "Offizielle Quelle"
    url: "https://merch.riotgames.com/de-de"
    unreliable: true

  - id: amzicards
    name: "Amzicards.de"
    category: "Fachshops (DE)"
    url: "https://amzicards.de"

  - id: tcgtrade
    name: "TCG-Trade.de"
    category: "Fachshops (DE)"
    url: "https://tcg-trade.de"

  - id: tabletopdragon
    name: "Tabletop-dragon.de"
    category: "Fachshops (DE)"
    url: "https://tabletop-dragon.de"

  - id: spielraum
    name: "SpielRaum (Wien)"
    category: "Oesterreich"
    url: "https://spielraum.co.at"
    unreliable: true

  - id: tcgdealers
    name: "TCG Dealers"
    category: "Oesterreich"
    url: "https://tcg-dealers.at"

  - id: cardmarket
    name: "Cardmarket"
    category: "Marktplatz"
    url: "https://www.cardmarket.com/de/Riftbound"
    unreliable: true

  - id: amazon
    name: "Amazon.de"
    category: "Amazon"
    url: "https://www.amazon.de"
    unreliable: true

  # Geizhals ist ein Preisvergleichsdienst: eine einzige Produktseite fasst
  # automatisch die Angebote VIELER Haendler zusammen. "in_stock_keywords: []"
  # bedeutet: kein Lager-Wort noetig, es reicht, dass der Ausverkauft-Satz fehlt.
  #
  # product_type: fixed  -> wird weiter geprueft (fuer Ledger-Sync), loest aber
  #                         KEINE Telegram-Nachricht mehr aus (z. B. einzelne
  #                         Champion-Decks, Sleeves, Playmats - fester Inhalt).
  # Kein product_type oder "booster" -> normale Benachrichtigung (Displays,
  #                         Tins, Elite Trainer Boxen - zufaelliger Inhalt).
  - id: geizhals_booster_display
    name: "Geizhals - Origins Booster Display (viele Haendler)"
    category: "Preisvergleich (Geizhals, viele Haendler)"
    url: "https://geizhals.de/league-of-legends-riftbound-origins-booster-display-en-a3517300.html"
    in_stock_keywords: []
    out_of_stock_keywords: ["es gibt derzeit keine anbieter"]
    product_type: booster

  - id: geizhals_spiritforged_display
    name: "Geizhals - Spiritforged Booster Display (viele Haendler)"
    category: "Preisvergleich (Geizhals, viele Haendler)"
    url: "https://geizhals.at/league-of-legends-riftbound-spiritforged-booster-display-en-a3726783.html"
    in_stock_keywords: []
    out_of_stock_keywords: ["es gibt derzeit keine anbieter"]
    product_type: booster

  - id: geizhals_leesin_deck
    name: "Geizhals - Lee Sin Champion Deck Display"
    category: "Preisvergleich (Geizhals, viele Haendler)"
    url: "https://geizhals.eu/league-of-legends-riftbound-origins-lee-sin-champion-deck-display-en-a3517325.html"
    in_stock_keywords: []
    out_of_stock_keywords: ["es gibt derzeit keine anbieter"]
    product_type: fixed
